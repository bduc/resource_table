name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resource_table_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: resource_table
      - uses: actions/checkout@v4
        with:
          repository: bduc/resource_core
          path: resource_core
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: resource_table
      - run: bin/rails db:prepare
        working-directory: resource_table
      - run: bundle exec rake test
        working-directory: resource_table
